<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="warmth" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#2a4a73" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1e3a5f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Navy background with a soft radial highlight -->
  <rect width="512" height="512" rx="96" fill="#1e3a5f"/>
  <rect width="512" height="512" rx="96" fill="url(#warmth)"/>

  <!-- Pulpit silhouette in cream, scaled from the 64x64 brand mark -->
